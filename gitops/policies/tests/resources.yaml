apiVersion: platform.internal/v1
kind: ChaosExperiment
metadata:
  name: chaos-same-ns
  namespace: team-checkout
spec:
  target:
    labelSelector: app=checkout
    maxReplicaPercentage: 30
  faultType: pod-kill
  duration: 5m
  abortOnSLOBreach:
    errorRateMax: 0.05
    latencyP99MaxMs: 1000
---

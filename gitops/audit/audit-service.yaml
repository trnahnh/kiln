# The only consumer of kiln.audit and the only holder of the writer credential
# (CLAUDE.md invariant, ADR-0018). Its ClusterRole lets POST /v1/requests apply the three
# request kinds on the caller's behalf; it never touches a TenantDatabase directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiln-audit-service
  namespace: kiln-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiln-audit-service
rules:
  - apiGroups: [platform.internal]
    resources: [databaseclaims, canaryrollouts, chaosexperiments]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiln-audit-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiln-audit-service
subjects:
  - kind: ServiceAccount
    name: kiln-audit-service
    namespace: kiln-audit
---
apiVersion: v1
kind: Service
metadata:
  name: kiln-audit-service
  namespace: kiln-audit
spec:
  selector:
    app.kubernetes.io/name: kiln-audit-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-audit-service
  namespace: kiln-audit
  labels:
    app.kubernetes.io/name: kiln-audit-service
spec:
  # One consumer: chain order is the insert order under the advisory lock, and a second
  # instance would only contend for it (DATA_MODEL.md, "Insert protocol").
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kiln-audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiln-audit-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: kiln-audit-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-service
          # Built by `make docker-build` and loaded with `make kind-load`; never pulled.
          image: kiln-audit-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://audit-postgres.kiln-audit.svc:5432/audit
            - name: SPRING_DATASOURCE_USERNAME
              value: audit_writer
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-postgres
                  key: writer-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka.kiln-kafka.svc:9092
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION
              value: file:/etc/kiln-audit/jwt/public.pem
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx384m
          volumeMounts:
            - name: jwt
              mountPath: /etc/kiln-audit/jwt
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: jwt
          secret:
            secretName: audit-jwt
            items:
              - key: public.pem
                path: public.pem

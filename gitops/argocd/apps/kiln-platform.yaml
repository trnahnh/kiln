# Stateless platform definitions: drift is auto-healed (SYSTEM_DESIGN section 2, ADR-0007).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiln-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # The operator generates its CRD; Git delivers it, so a fresh cluster has the kind the
    # composition emits and the policy guards before either is applied.
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: operator/config/crd/bases
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: gitops/compositions
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: gitops/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

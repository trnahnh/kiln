# Stateless platform definitions: drift is auto-healed (SYSTEM_DESIGN section 2, ADR-0007).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiln-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # Each Go module generates its own CRD; Git delivers them all here (ADR-0012), so a
    # fresh cluster has every platform kind before anything that emits or guards one.
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: operator/config/crd/bases
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: delivery-controller/config/crd/bases
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: gitops/compositions
    - repoURL: https://github.com/trnahnh/kiln.git
      targetRevision: main
      path: gitops/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

# The image is built locally and loaded into kind (`make docker-build kind-load` in
# scheduler-plugin/); Git owns everything else about the deployment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiln-scheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/trnahnh/kiln.git
    targetRevision: main
    path: scheduler-plugin/config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

# The image is built locally and loaded into kind (`make docker-build kind-load` in chaos/);
# Git owns everything else. Wave 2: the CRD arrives with kiln-platform in wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiln-chaos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/trnahnh/kiln.git
    targetRevision: main
    path: chaos/config/manager
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

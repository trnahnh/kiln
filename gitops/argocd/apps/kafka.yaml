# The audit event stream (ADR-0018). Wave 0: every controller publishes to it and the audit
# service consumes it, so the broker is up before any of them starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/trnahnh/kiln.git
    targetRevision: main
    path: gitops/kafka
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

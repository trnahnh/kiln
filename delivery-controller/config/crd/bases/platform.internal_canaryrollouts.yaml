---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: canaryrollouts.platform.internal
spec:
  group: platform.internal
  names:
    kind: CanaryRollout
    listKind: CanaryRolloutList
    plural: canaryrollouts
    singular: canaryrollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetDeployment
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentStep
      name: Step
      type: integer
    - jsonPath: .status.canaryWeight
      name: Weight
      type: integer
    - jsonPath: .status.lastAnalysisResult
      name: Analysis
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              analysis:
                properties:
                  alpha:
                    default: 0.05
                    description: Ceiling on the probability that a canary meeting
                      the criteria is rolled back.
                    maximum: 0.5
                    minimum: 0.0001
                    type: number
                  beta:
                    default: 0.1
                    description: Ceiling on the probability that a canary at the regression
                      magnitude is promoted.
                    maximum: 0.5
                    minimum: 0.0001
                    type: number
                  drainGrace:
                    description: |-
                      How long the canary keeps running after traffic has been routed away from it, so
                      meshed clients whose sidecars have not yet received the new routes are not sent to
                      pods that are already gone. Unset means 10s; an explicit zero parks the canary
                      immediately.
                    type: string
                  interval:
                    default: 15s
                    description: How often metrics are read and the sequential test
                      advanced.
                    type: string
                  maxStepDuration:
                    default: 30m
                    description: A checkpoint that has neither promoted nor rolled
                      back within this window rolls back.
                    type: string
                  regressionFactor:
                    default: 2
                    description: The alternative hypothesis is this multiple of the
                      configured maximum.
                    minimum: 1.1
                    type: number
                type: object
              metricProvider:
                default: prometheus
                enum:
                - prometheus
                type: string
              stepPercentages:
                description: |-
                  Canary traffic checkpoints, ascending, ending at 100. Each must be accepted on fresh
                  samples; between them traffic moves in confidence-sized sub-steps.
                items:
                  format: int32
                  maximum: 100
                  minimum: 1
                  type: integer
                maxItems: 20
                minItems: 1
                type: array
              successCriteria:
                properties:
                  errorRateMax:
                    description: Highest acceptable fraction of 5xx responses; the
                      null hypothesis of the error test.
                    maximum: 1
                    minimum: 0
                    type: number
                  latencyP99MaxMs:
                    description: Highest acceptable p99 latency; at most 1% of requests
                      may be slower than this.
                    format: int32
                    minimum: 1
                    type: integer
                  minSampleSize:
                    description: |-
                      Requests the canary must have served since reaching the current checkpoint before any
                      decision, promote or rollback, is allowed to fire.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - errorRateMax
                - latencyP99MaxMs
                - minSampleSize
                type: object
              targetDeployment:
                description: |-
                  Deployment in the same namespace whose pod template drives rollouts; it serves as the
                  canary, the controller owns the primary copy.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: targetDeployment is immutable
                  rule: self == oldSelf
            required:
            - stepPercentages
            - successCriteria
            - targetDeployment
            type: object
          status:
            properties:
              analysis:
                properties:
                  anomalies:
                    format: int32
                    type: integer
                  checkpoint:
                    description: Index into stepPercentages of the last checkpoint
                      reached.
                    format: int32
                    type: integer
                  checkpointStartedAt:
                    format: date-time
                    type: string
                  confidence:
                    type: number
                  errors:
                    description: |-
                      Per-criterion sequential test state; the cumulative statistic decides rollback, the
                      checkpoint statistic decides acceptance and sizes the next sub-step.
                    properties:
                      cumulative:
                        type: number
                      sinceCheckpoint:
                        type: number
                    type: object
                  lastCounters:
                    properties:
                      at:
                        format: date-time
                        type: string
                      errors:
                        type: number
                      requests:
                        type: number
                      slow:
                        type: number
                    required:
                    - at
                    - errors
                    - requests
                    - slow
                    type: object
                  lastTickAt:
                    format: date-time
                    type: string
                  latency:
                    description: |-
                      Per-criterion sequential test state; the cumulative statistic decides rollback, the
                      checkpoint statistic decides acceptance and sizes the next sub-step.
                    properties:
                      cumulative:
                        type: number
                      sinceCheckpoint:
                        type: number
                    type: object
                  samplesSinceCheckpoint:
                    format: int64
                    type: integer
                  shrink:
                    description: Pending halvings of the next sub-step, one per anomalous
                      tick.
                    format: int32
                    type: integer
                  totalSamples:
                    format: int64
                    type: integer
                required:
                - checkpoint
                type: object
              canaryWeight:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentStep:
                description: 1-based index of the last stepPercentages checkpoint
                  reached.
                format: int32
                type: integer
              lastAnalysisResult:
                enum:
                - Pending
                - Pass
                - Fail
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedTemplateHash:
                type: string
              phase:
                enum:
                - Initializing
                - Progressing
                - Analyzing
                - Promoting
                - Draining
                - RolledBack
                - Succeeded
                type: string
              promotedTemplateHash:
                type: string
              reason:
                type: string
              targetReplicas:
                description: |-
                  Replica count the target Deployment had when last seen non-zero; restored for each
                  rollout since the target is scaled to zero while idle.
                format: int32
                type: integer
              trafficFlippedAt:
                description: |-
                  When the VirtualService was last routed entirely to primary; the canary is parked
                  drainGrace after this.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

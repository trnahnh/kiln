name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/METRICS.md"
      - ".github/workflows/web.yaml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: metrics.json matches docs/METRICS.md
        run: pnpm check:metrics
      - name: drawing assets are committed
        run: pnpm build:draft && git diff --exit-code -- public/draft
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

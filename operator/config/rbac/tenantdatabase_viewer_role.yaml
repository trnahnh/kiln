# This rule is not used by the project kiln-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.internal resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kiln-operator
    app.kubernetes.io/managed-by: kustomize
  name: tenantdatabase-viewer-role
rules:
- apiGroups:
  - platform.internal
  resources:
  - tenantdatabases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.internal
  resources:
  - tenantdatabases/status
  verbs:
  - get

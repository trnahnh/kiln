apiVersion: v1
kind: Namespace
metadata:
  name: kiln-scheduler-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiln-scheduler
  namespace: kiln-scheduler-system
---
# The upstream scheduler ClusterRoles grant exactly what a second scheduler needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiln-scheduler-as-kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: kiln-scheduler
    namespace: kiln-scheduler-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiln-scheduler-as-volume-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: kiln-scheduler
    namespace: kiln-scheduler-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiln-scheduler-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: kiln-scheduler
    namespace: kiln-scheduler-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-scheduler
  namespace: kiln-scheduler-system
  labels:
    app.kubernetes.io/name: kiln-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kiln-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiln-scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10259"
        prometheus.io/scheme: https
    spec:
      serviceAccountName: kiln-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kiln-scheduler
          # Built by `make docker-build` and loaded with `make kind-load`; never pulled.
          image: kiln-scheduler:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/kiln-scheduler/config.yaml
            - --v=2
          volumeMounts:
            - name: config
              mountPath: /etc/kiln-scheduler
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kiln-scheduler-config

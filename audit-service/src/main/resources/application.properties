spring.application.name=audit-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:audit_writer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

kiln.audit.topic=${KILN_AUDIT_TOPIC:kiln.audit}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=kiln-audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=1

spring.security.oauth2.resourceserver.jwt.public-key-location=${KILN_AUDIT_JWT_PUBLIC_KEY:file:/etc/kiln-audit/jwt/public.pem}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
